<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부부 공동 가계부</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell page-shell--select" id="appShell">
    <section class="select-panel" id="authPanel">
      <div class="select-panel__header">
        <p class="eyebrow">Household Budget</p>
        <h1>누가 기록하나요?</h1>
        <p class="subtext">수입과 지출을 우진/하정 기준으로 구분해서 저장합니다.</p>
      </div>

      <div class="user-picker" id="profileList" aria-label="사용자 선택">
        <button type="button" class="user-card" data-profile-id="husband">
          <span class="user-card__avatar">우</span>
          <span class="user-card__name">우진</span>
          <span class="user-card__hint">우진으로 기록 시작</span>
        </button>
        <button type="button" class="user-card" data-profile-id="wife">
          <span class="user-card__avatar">하</span>
          <span class="user-card__name">하정</span>
          <span class="user-card__hint">하정으로 기록 시작</span>
        </button>
      </div>

      <p class="error-text" id="authError" role="status"></p>
    </section>

    <div class="protected-content is-hidden" id="protectedContent">
      <header class="app-header">
        <div>
          <p class="eyebrow">Couple Budget</p>
          <h1>부부 공동 가계부</h1>
          <p class="subtext">고정비와 일상 수입/지출을 함께 기록하고 흐름을 확인합니다.</p>
        </div>
        <div class="current-user">
          <span class="current-user__label">현재 사용자</span>
          <strong id="householdUser">미선택</strong>
          <button type="button" class="ghost-button" id="refreshButton">사용자 변경</button>
        </div>
      </header>

      <section class="summary-grid" id="summaryCards" aria-label="이번 달 요약"></section>

      <nav class="tab-nav" aria-label="가계부 메뉴">
        <button type="button" class="tab-button" data-tab="monthly">월별 통계</button>
        <button type="button" class="tab-button" data-tab="daily">일별 통계</button>
        <button type="button" class="tab-button" data-tab="entry">수입 / 지출 입력</button>
        <button type="button" class="tab-button" data-tab="fixed">고정비 관리</button>
        <button type="button" class="tab-button" data-tab="history">전체 내역</button>
      </nav>

      <main class="tab-panels">
        <section class="tab-panel" data-tab-panel="monthly">
          <div class="panel">
            <div class="section-heading">
              <div>
                <p class="section-heading__eyebrow">Monthly Statistics</p>
                <h2>월별 수입 / 지출 흐름</h2>
              </div>
            </div>
            <div id="monthlyBreakdown" class="insight-grid"></div>
            <div class="chart-card">
              <div class="chart-legend">
                <span><i class="legend-swatch legend-swatch--income"></i>수입</span>
                <span><i class="legend-swatch legend-swatch--expense"></i>지출</span>
              </div>
              <canvas id="monthlyChart" height="300" aria-label="월별 수입 지출 그래프"></canvas>
            </div>
          </div>
        </section>

        <section class="tab-panel" data-tab-panel="daily">
          <div class="panel">
            <div class="section-heading">
              <div>
                <p class="section-heading__eyebrow">Daily Statistics</p>
                <h2>이번 달 일별 수입 / 지출</h2>
              </div>
            </div>
            <div class="chart-card">
              <div class="chart-legend">
                <span><i class="legend-swatch legend-swatch--income"></i>수입</span>
                <span><i class="legend-swatch legend-swatch--expense"></i>지출</span>
              </div>
              <canvas id="dailyChart" height="300" aria-label="일별 수입 지출 그래프"></canvas>
            </div>
          </div>
        </section>

        <section class="tab-panel" data-tab-panel="entry">
          <div class="panel">
            <div class="section-heading">
              <div>
                <p class="section-heading__eyebrow">Transaction Entry</p>
                <h2>수입 / 지출 입력</h2>
              </div>
            </div>
            <form id="transactionForm" class="entry-form">
              <label>
                날짜
                <input type="date" name="date" required>
              </label>
              <label>
                구분
                <select name="type" required>
                  <option value="income">수입</option>
                  <option value="expense">지출</option>
                </select>
              </label>
              <label>
                카테고리
                <input type="text" name="category" placeholder="예: 급여, 식비, 교통비" required>
              </label>
              <label>
                금액
                <input type="number" name="amount" min="0" step="1" placeholder="예: 50000" required>
              </label>
              <label class="entry-form__wide">
                메모
                <input type="text" name="note" placeholder="선택 사항">
              </label>
              <button type="submit">내역 저장</button>
            </form>
          </div>
        </section>

        <section class="tab-panel" data-tab-panel="fixed">
          <div class="panel">
            <div class="section-heading">
              <div>
                <p class="section-heading__eyebrow">Fixed Costs</p>
                <h2>고정비 관리</h2>
              </div>
            </div>
            <form id="fixedExpenseForm" class="entry-form">
              <label>
                항목명
                <input type="text" name="name" placeholder="예: 월세, 통신비, 보험료" required>
              </label>
              <label>
                금액
                <input type="number" name="amount" min="0" step="1" placeholder="예: 850000" required>
              </label>
              <button type="submit">고정비 추가</button>
            </form>
            <div id="fixedExpenseList" class="stack-list"></div>
          </div>
        </section>

        <section class="tab-panel" data-tab-panel="history">
          <div class="panel">
            <div class="section-heading">
              <div>
                <p class="section-heading__eyebrow">History</p>
                <h2>전체 내역</h2>
              </div>
            </div>
            <div id="transactionList" class="table-card"></div>
          </div>
        </section>
      </main>

      <div class="legacy-hidden" aria-hidden="true">
        <form id="authForm"></form>
        <p id="profileEmptyState"></p>
        <section id="dashboardState"></section>
        <section id="householdPanel"></section>
        <span id="householdName"></span>
        <span id="householdInviteCode"></span>
        <p id="householdMessage"></p>
      </div>
    </div>
  </div>

  <script src="selector-app.js"></script>
</body>
</html>
